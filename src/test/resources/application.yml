spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    model:
      chat: none
    openai:
      api-key: ""
app:
  file:
    storage:
      minio:
        enabled: false
      aliyun:
        enabled: false
  auth:
    mock:
      enabled: true
      user-id: mock-user
      username: mock-user
