spring:
  application:
    name: ai-item-summary
  config:
    # Local overrides in the process working directory; absent files are allowed.
    import: "optional:file:./.env[.properties][encoding=utf-8]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_item_summary?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Apply deploy/mysql/schema.sql manually to the selected database.
      mode: never
  servlet:
    multipart:
      max-file-size: ${APP_FILE_MAX_SIZE:20MB}
      max-request-size: ${APP_FILE_REQUEST_MAX_SIZE:20MB}
  ai:
    model:
      # Keep the base project runnable without an AI provider credential.
      # Set SPRING_AI_MODEL_CHAT=openai to enable the OpenAI chat model.
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:none}
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        use-tls: ${QDRANT_USE_TLS:false}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:knowledge_chunks}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:}

mybatis-plus:
  configuration:
    # Do not log SQL parameters: user writes include personal data and password hashes.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  knowledge:
    rag:
      enabled: ${APP_KNOWLEDGE_RAG_ENABLED:false}
      batch-size: ${RAG_BATCH_SIZE:128}
      chunk-size: ${RAG_CHUNK_SIZE:512}
      parent-chunk-size: ${RAG_PARENT_CHUNK_SIZE:2048}
      chunk-overlap: ${RAG_CHUNK_OVERLAP:0}
      min-chunk-size-chars: ${RAG_MIN_CHUNK_SIZE_CHARS:200}
      min-chunk-length-to-embed: ${RAG_MIN_CHUNK_LENGTH_TO_EMBED:0}
      max-num-chunks: ${RAG_MAX_NUM_CHUNKS:100000}
      keep-separator: ${RAG_KEEP_SEPARATOR:true}
      punctuation-marks: "${RAG_PUNCTUATION_MARKS:.?!;。？！；\n}"
      max-source-size: ${APP_FILE_MAX_SIZE:20MB}
  auth:
    mock:
      enabled: ${APP_AUTH_MOCK_ENABLED:true}
      user-id: ${APP_AUTH_MOCK_USER_ID:mock-user}
      username: ${APP_AUTH_MOCK_USERNAME:mock-user}
  file:
    upload:
      max-size: ${APP_FILE_MAX_SIZE:20MB}
      allowed-extensions: [txt, md, pdf, docx]
    storage:
      key-prefix: ${FILE_STORAGE_KEY_PREFIX:files}
      download-url-expiration: ${FILE_STORAGE_DOWNLOAD_URL_EXPIRATION:15m}
      connect-timeout: ${FILE_STORAGE_CONNECT_TIMEOUT:5s}
      read-timeout: ${FILE_STORAGE_READ_TIMEOUT:60s}
      write-timeout: ${FILE_STORAGE_WRITE_TIMEOUT:60s}
      minio:
        enabled: ${MINIO_ENABLED:false}
        endpoint: ${MINIO_ENDPOINT:}
        bucket: ${MINIO_BUCKET:}
        region: ${MINIO_REGION:us-east-1}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        path-style-access: ${MINIO_PATH_STYLE_ACCESS:true}
      aliyun:
        enabled: ${ALIYUN_OSS_ENABLED:false}
        # OSS 项目目录叠加在公共 key-prefix 前，完整 Key 不以斜杠开头。
        key-prefix: ${ALIYUN_OSS_KEY_PREFIX:item/${spring.application.name}}
        endpoint: ${ALIYUN_OSS_ENDPOINT:}
        bucket: ${ALIYUN_OSS_BUCKET:}
        access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
        access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Allow UTF-8 filenames up to the application limit, while keeping a finite per-part header budget.
    max-part-header-size: ${APP_FILE_MAX_PART_HEADER_SIZE:4KB}
